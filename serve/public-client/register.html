    <title>Rino CMS Login</title>
  </head>
  <body>
    <div id="globalNav">
  <a href="/">Home</a>
  <a href="/content-list">Published content</a>
  <a href="/login">Login</a>
  <a href="/register">Register</a>
  <a href="/backoffice/">Backoffice</a>
</div>


    <main>
      <h2>Register</h2>
      <form
        id="register-form"
        class="register-form"
        method="POST"
        action="/register"
      >
        <input
          id="username-input"
          class="username-input"
          name="username"
          placeholder="Username"
          autocomplete="username"
          required
        />
        <br />
        <input
          id="email-input"
          class="email-input"
          name="email"
          tpye="email"
          placeholder="Email"
          autocomplete="email"
          required
        />
        <br />
        <input
          id="password-input"
          class="password-input"
          name="password"
          type="password"
          autocomplete="new-password"
          placeholder="Password"
          required
        />
        <br />
        <input
          id="confirm-password-input"
          class="confirm-password-input"
          name="confirmPassword"
          type="password"
          autocomplete="new-password"
          placeholder="Confirm Password"
          required
        />
        <br />
        <input type="text" name="website" style="display: none" />
        <br />
        <small id="form-msg"></small>
        <br />
        <button type="submit">Register</button>
      </form>
      <p>Already have an account? <a href="/login">Login</a></p>
    </main>
    <footer></footer>
  </body>
</html>
