<!DOCTYPE html>
<html>
  <head>
    <component @path="head" />
    <meta name="description" content="Backoffice login" />
    <meta name="og:title" content="Rino CMS Backoffice Login" />
    <meta name="og:description" content="Sign in to access the Rino CMS backoffice." />

    <title>Rino CMS Backoffice Login</title>
  </head>
  <body>
    <component @path="header" />
    <main>
      <section class="dashboard-hero">
        <p class="dashboard-kicker">Admin access</p>
        <h1>Sign in to the backoffice</h1>
        <p class="dashboard-copy">
          Backoffice pages are now protected by the CMS session flow and require
          an admin-capable account.
        </p>
      </section>

      <section class="dashboard-panel">
        <h2>Login</h2>
        <form method="POST" action="/login">
        <input name="username" placeholder="Username" required />
        <br />
        <br />
        <input
          name="password"
          type="password"
          placeholder="Password"
          required
        />
        <br />
        <br />
        <button type="submit">Login</button>
        </form>
        <p>Need a regular account first? <a href="/register">Register</a></p>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
